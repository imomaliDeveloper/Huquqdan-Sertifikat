<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🔥 Ustoz AI — GoPrep Angry Voice Agent (Gemini 3.8)</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @keyframes flameFlicker {
      0%, 100% {
        transform: scale(1) rotate(-1deg);
        filter: drop-shadow(0 0 25px rgba(239, 68, 68, 0.8)) drop-shadow(0 0 45px rgba(245, 158, 11, 0.7));
      }
      25% {
        transform: scale(1.08) rotate(2deg) translateY(-4px);
        filter: drop-shadow(0 0 35px rgba(239, 68, 68, 0.9)) drop-shadow(0 0 60px rgba(245, 158, 11, 0.9));
      }
      50% {
        transform: scale(0.97) rotate(-2deg);
        filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.7)) drop-shadow(0 0 35px rgba(245, 158, 11, 0.6));
      }
      75% {
        transform: scale(1.05) rotate(1deg) translateY(-2px);
        filter: drop-shadow(0 0 30px rgba(239, 68, 68, 0.85)) drop-shadow(0 0 50px rgba(245, 158, 11, 0.8));
      }
    }

    @keyframes pulseRing {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.3;
      }
      100% {
        transform: scale(0.95);
        opacity: 0.8;
      }
    }

    @keyframes mouthTalk {
      0%, 100% { height: 8px; border-radius: 4px; }
      50% { height: 26px; border-radius: 12px; }
    }

    @keyframes soundBar {
      0%, 100% { height: 6px; }
      50% { height: 32px; }
    }

    .flame-active {
      animation: flameFlicker 0.45s infinite ease-in-out;
      opacity: 1 !important;
      visibility: visible !important;
    }

    .pulse-ring-active {
      animation: pulseRing 1.5s infinite ease-in-out;
    }

    .talking-mouth {
      animation: mouthTalk 0.22s infinite ease-in-out alternate;
    }

    /* Ovoz to'lqinlari */
    .bar-1 { animation: soundBar 0.5s infinite ease-in-out alternate 0.1s; }
    .bar-2 { animation: soundBar 0.4s infinite ease-in-out alternate 0.2s; }
    .bar-3 { animation: soundBar 0.6s infinite ease-in-out alternate 0.05s; }
    .bar-4 { animation: soundBar 0.35s infinite ease-in-out alternate 0.25s; }
    .bar-5 { animation: soundBar 0.55s infinite ease-in-out alternate 0.15s; }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-black text-slate-100 min-h-screen flex flex-col justify-between select-none overflow-x-hidden font-sans">

  <!-- TOP HEADER -->
  <header class="w-full max-w-xl mx-auto px-4 pt-4 pb-2 flex items-center justify-between z-20">
    <!-- Persona Pill Badge -->
    <div class="relative">
      <button id="personaDropdownBtn" class="flex items-center gap-2 bg-neutral-900/90 border border-neutral-700/80 px-3.5 py-1.5 rounded-full text-xs font-semibold text-neutral-200 shadow-lg hover:border-red-500/60 transition backdrop-blur">
        <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
        <span id="currentPersonaLabel">Ustoz AI: Angry 🔥</span>
        <i class="fa-solid fa-chevron-down text-[10px] text-neutral-400 ml-1"></i>
      </button>

      <!-- Dropdown Menu -->
      <div id="personaMenu" class="hidden absolute left-0 mt-2 w-56 bg-neutral-900/95 border border-neutral-700 rounded-2xl shadow-2xl p-2 z-50 backdrop-blur">
        <button onclick="selectPersona('angry')" class="w-full text-left px-3 py-2 rounded-xl text-xs font-semibold hover:bg-red-500/20 hover:text-red-400 flex items-center justify-between text-neutral-200 transition">
          <span>🔥 G'azablangan Ustoz (Angry)</span>
          <i class="fa-solid fa-check text-red-500 text-xs" id="check-angry"></i>
        </button>
        <button onclick="selectPersona('judge')" class="w-full text-left px-3 py-2 rounded-xl text-xs font-semibold hover:bg-amber-500/20 hover:text-amber-400 flex items-center justify-between text-neutral-400 transition">
          <span>⚖️ Qattiqqo'l Sudya (Judge)</span>
          <i class="fa-solid fa-check text-amber-500 text-xs hidden" id="check-judge"></i>
        </button>
        <button onclick="selectPersona('coach')" class="w-full text-left px-3 py-2 rounded-xl text-xs font-semibold hover:bg-emerald-500/20 hover:text-emerald-400 flex items-center justify-between text-neutral-400 transition">
          <span>⚡ Jo'shqin Murabbiy (Coach)</span>
          <i class="fa-solid fa-check text-emerald-500 text-xs hidden" id="check-coach"></i>
        </button>
      </div>
    </div>

    <!-- Right Actions -->
    <div class="flex items-center gap-2">
      <a href="/" class="text-xs text-neutral-400 hover:text-white px-2.5 py-1 rounded-lg bg-neutral-900 border border-neutral-800 transition">
        <i class="fa-solid fa-house mr-1"></i> Asosiy
      </a>
      <button id="resetSessionBtn" class="text-xs text-red-400 hover:text-red-300 px-3 py-1 rounded-lg bg-red-950/40 border border-red-900/60 font-medium transition">
        <i class="fa-solid fa-power-off mr-1"></i> Tugatish
      </button>
    </div>
  </header>

  <!-- MAIN INTERACTIVE ARENA -->
  <main class="w-full max-w-xl mx-auto flex-1 flex flex-col items-center justify-center px-4 relative my-auto">
    
    <!-- Visualizer Background Glow -->
    <div id="ambientGlow" class="absolute w-72 h-72 rounded-full bg-red-600/15 blur-[90px] -z-10 transition-all duration-500 pointer-events-none"></div>

    <!-- AVATAR CONTAINER (GOPREP STYLE) -->
    <div class="relative flex flex-col items-center justify-center my-4">
      
      <!-- Olov Animatsiyasi (Gapirayotganda Boshidan Chiqadi) -->
      <div id="flameContainer" class="absolute -top-16 opacity-0 transition-opacity duration-300 pointer-events-none z-20">
        <svg class="w-36 h-36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 0C50 0 32 25 35 48C30 42 28 35 28 35C28 35 15 52 22 72C28 88 42 98 52 98C72 98 84 82 84 62C84 36 62 20 50 0Z" fill="url(#flameGradient1)" opacity="0.95"/>
          <path d="M48 24C48 24 38 40 42 58C38 52 36 46 36 46C36 46 26 60 32 75C36 85 45 92 52 92C65 92 74 80 72 64C70 46 56 36 48 24Z" fill="url(#flameGradient2)"/>
          <path d="M50 48C50 48 44 60 48 72C46 68 45 64 45 64C45 64 40 70 44 80C46 86 51 90 54 90C62 90 66 82 64 72C62 60 55 54 50 48Z" fill="#FEF08A"/>
          <defs>
            <linearGradient id="flameGradient1" x1="50" y1="0" x2="50" y2="100" gradientUnits="userSpaceOnUse">
              <stop stop-color="#EF4444"/>
              <stop offset="0.6" stop-color="#F97316"/>
              <stop offset="1" stop-color="#EAB308"/>
            </linearGradient>
            <linearGradient id="flameGradient2" x1="50" y1="20" x2="50" y2="95" gradientUnits="userSpaceOnUse">
              <stop stop-color="#F97316"/>
              <stop offset="0.8" stop-color="#FACC15"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- Radar / Pulsing Ring (Eshitayotganda ishlaydi) -->
      <div id="radarRing" class="absolute w-56 h-56 rounded-full border-2 border-red-500/30 -z-0 opacity-0 transition-opacity duration-300"></div>

      <!-- AVATAR BOSHI / YUZI -->
      <div id="avatarFace" class="w-44 h-44 rounded-full bg-gradient-to-b from-neutral-800 to-neutral-950 border-4 border-neutral-700/80 shadow-[0_0_50px_rgba(0,0,0,0.8)] relative flex flex-col items-center justify-center transition-all duration-300 z-10">
        
        <!-- Qoshlar (G'azablangan burchak bilan) -->
        <div class="flex justify-between w-24 mb-1">
          <div id="leftEyebrow" class="w-9 h-2.5 bg-neutral-300 rounded-full rotate-[18deg] shadow transition-all duration-200"></div>
          <div id="rightEyebrow" class="w-9 h-2.5 bg-neutral-300 rounded-full -rotate-[18deg] shadow transition-all duration-200"></div>
        </div>

        <!-- Ko'zlar (Jiddiy, o'tkir nigoh) -->
        <div class="flex justify-between w-24 mb-3 px-1">
          <div class="w-6 h-6 rounded-full bg-red-950 border-2 border-red-500/80 flex items-center justify-center relative shadow-[0_0_10px_rgba(239,68,68,0.5)]">
            <div id="leftPupil" class="w-3 h-3 rounded-full bg-red-400"></div>
          </div>
          <div class="w-6 h-6 rounded-full bg-red-950 border-2 border-red-500/80 flex items-center justify-center relative shadow-[0_0_10px_rgba(239,68,68,0.5)]">
            <div id="rightPupil" class="w-3 h-3 rounded-full bg-red-400"></div>
          </div>
        </div>

        <!-- Og'iz (Gapirganda ochilib yopiladi) -->
        <div class="h-8 flex items-center justify-center">
          <div id="mouth" class="w-14 h-2 bg-red-500/80 rounded-full transition-all duration-150 shadow-[0_0_8px_rgba(239,68,68,0.6)]"></div>
        </div>

      </div>

    </div>

    <!-- HOLAT KO'RSATKICHI (STATUS TEXT) -->
    <div class="mt-4 text-center">
      <div id="statusBadge" class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-neutral-900 border border-neutral-800 text-xs font-semibold tracking-wide text-neutral-300 shadow-md">
        <span id="statusDot" class="w-2 h-2 rounded-full bg-neutral-500"></span>
        <span id="statusText">Gapirish uchun tugmani bosing</span>
      </div>
    </div>

    <!-- SOUNDWAVE VISUALIZER BARS (SPEAKING / LISTENING VAQTIDA) -->
    <div id="soundBarsContainer" class="flex items-center gap-1.5 h-10 mt-3 opacity-0 transition-opacity duration-300">
      <div class="w-1 bg-red-500 rounded-full bar-1"></div>
      <div class="w-1 bg-orange-500 rounded-full bar-2"></div>
      <div class="w-1.5 bg-yellow-400 rounded-full bar-3"></div>
      <div class="w-1 bg-orange-500 rounded-full bar-4"></div>
      <div class="w-1 bg-red-500 rounded-full bar-5"></div>
    </div>

    <!-- SUBTITR KARTASI (VIDEODAGI KABI JONLI MATN) -->
    <div id="subtitlesBox" class="w-full mt-4 bg-neutral-900/80 border border-neutral-800 rounded-2xl p-4 shadow-xl backdrop-blur transition-all duration-300 min-h-[90px] flex flex-col justify-center">
      <div class="text-[11px] font-bold uppercase tracking-wider text-neutral-500 mb-1 flex items-center justify-between">
        <span id="speakerLabel"><i class="fa-solid fa-volume-high mr-1 text-red-500"></i> Ustoz:</span>
        <span id="liveTimestamp" class="text-[10px] text-neutral-600">Tayyor</span>
      </div>
      <p id="subtitlesText" class="text-sm font-medium text-neutral-200 leading-relaxed italic">
        "Qani, nimaga turibsan?! Gapir, savoling nima? Vaqtimni o'g'irlama!"
      </p>
    </div>

    <!-- PROVOKATSION TEZKOR SAVOLLAR (TUGMALAR) -->
    <div class="w-full mt-3 flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar text-xs">
      <button onclick="sendQuickPrompt('ChatGPT sizdan ancha aqlliroq ekanku!')" class="shrink-0 bg-neutral-900 hover:bg-neutral-800 border border-neutral-850 hover:border-red-500/50 text-neutral-400 hover:text-white px-3 py-1.5 rounded-xl transition">
        💬 "ChatGPT sizdan aqlli..."
      </button>
      <button onclick="sendQuickPrompt('Huquqdan qiyinroq bitta savol beringchi!')" class="shrink-0 bg-neutral-900 hover:bg-neutral-800 border border-neutral-850 hover:border-amber-500/50 text-neutral-400 hover:text-white px-3 py-1.5 rounded-xl transition">
        ⚖️ "Qiyin savol bering!"
      </button>
      <button onclick="sendQuickPrompt('Bugun dars qilgim kelmayapti, charchadim...')" class="shrink-0 bg-neutral-900 hover:bg-neutral-800 border border-neutral-850 hover:border-red-500/50 text-neutral-400 hover:text-white px-3 py-1.5 rounded-xl transition">
        😴 "Charchadim, o'qimayman..."
      </button>
    </div>

  </main>

  <!-- BOTTOM CONTROLS (GOPREP BUTTONS) -->
  <footer class="w-full max-w-xl mx-auto px-4 pb-6 pt-2 z-20">
    <div class="bg-neutral-900/90 border border-neutral-800 rounded-3xl p-3 shadow-2xl backdrop-blur flex items-center justify-between gap-3">
      
      <!-- Hands-free Toggle Button -->
      <button id="handsFreeBtn" class="flex-1 flex flex-col items-center justify-center py-2.5 px-2 rounded-2xl border border-neutral-800 bg-neutral-950/60 text-neutral-400 hover:text-neutral-200 hover:border-neutral-700 transition">
        <i class="fa-solid fa-headset text-base mb-1" id="handsFreeIcon"></i>
        <span class="text-[11px] font-semibold tracking-tight">Hands-free</span>
        <span id="handsFreeStatus" class="text-[9px] text-neutral-500">O'chiq</span>
      </button>

      <!-- MAIN HOLD TO TALK / TAP TO TALK BUTTON -->
      <button id="talkBtn" class="flex-[1.6] py-3.5 px-4 rounded-2xl bg-gradient-to-r from-red-600 via-orange-600 to-amber-600 hover:from-red-500 hover:to-amber-500 active:scale-95 text-white font-extrabold shadow-lg shadow-red-600/30 flex items-center justify-center gap-2.5 transition-all text-sm tracking-wide">
        <i class="fa-solid fa-microphone text-lg" id="talkMicIcon"></i>
        <span id="talkBtnLabel">Hold to talk</span>
      </button>

      <!-- Subtitles Toggle Button -->
      <button id="subtitlesToggleBtn" class="flex-1 flex flex-col items-center justify-center py-2.5 px-2 rounded-2xl border border-neutral-800 bg-neutral-950/60 text-neutral-300 hover:text-white hover:border-neutral-700 transition">
        <i class="fa-solid fa-closed-captioning text-base mb-1 text-red-400"></i>
        <span class="text-[11px] font-semibold tracking-tight">Subtitles</span>
        <span id="subtitlesStatus" class="text-[9px] text-red-400">Yoqiq</span>
      </button>

    </div>

    <!-- Fallback Text Input Toggle (Klaviatura orqali yozish imkoniyati) -->
    <div class="mt-2.5 flex items-center justify-between px-2 text-[11px] text-neutral-500">
      <span>Mikrofon ishlamasa klaviaturadan foydalaning:</span>
      <button onclick="toggleTextInput()" class="text-neutral-400 hover:text-red-400 underline transition">
        <i class="fa-solid fa-keyboard mr-1"></i> Yozma rejim
      </button>
    </div>

    <!-- Hidden Text Input Box -->
    <div id="manualInputContainer" class="hidden mt-2 flex gap-2">
      <input type="text" id="manualInputText" placeholder="Ustozga gapiring yoki yozing..." class="flex-1 bg-neutral-900 border border-neutral-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-red-500">
      <button onclick="submitManualText()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition">
        Yuborish
      </button>
    </div>
  </footer>

  <!-- HIDDEN AUDIO ELEMENT FOR GEMINI VOICE PLAYBACK -->
  <audio id="audioPlayer" class="hidden" playsinline></audio>

  <!-- JAVASCRIPT LOGIC (GEMINI VOICE AGENT) -->
  <script>
    // Global State
    let currentPersona = 'angry';
    let isHandsFree = false;
    let isSubtitlesOn = true;
    let isRecording = false;
    let isThinking = false;
    let isSpeaking = false;
    let conversationHistory = [];
    
    // Web Speech Recognition
    let recognition = null;
    let speechBuffer = '';

    // Elements
    const flameContainer = document.getElementById('flameContainer');
    const radarRing = document.getElementById('radarRing');
    const avatarFace = document.getElementById('avatarFace');
    const mouth = document.getElementById('mouth');
    const leftPupil = document.getElementById('leftPupil');
    const rightPupil = document.getElementById('rightPupil');
    const statusBadge = document.getElementById('statusBadge');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const soundBars = document.getElementById('soundBarsContainer');
    const subtitlesBox = document.getElementById('subtitlesBox');
    const subtitlesText = document.getElementById('subtitlesText');
    const speakerLabel = document.getElementById('speakerLabel');
    const liveTimestamp = document.getElementById('liveTimestamp');
    const talkBtn = document.getElementById('talkBtn');
    const talkBtnLabel = document.getElementByIdLabel = document.getElementById('talkBtnLabel');
    const talkMicIcon = document.getElementById('talkMicIcon');
    const handsFreeBtn = document.getElementById('handsFreeBtn');
    const handsFreeStatus = document.getElementById('handsFreeStatus');
    const handsFreeIcon = document.getElementById('handsFreeIcon');
    const subtitlesToggleBtn = document.getElementById('subtitlesToggleBtn');
    const subtitlesStatus = document.getElementById('subtitlesStatus');
    const personaDropdownBtn = document.getElementById('personaDropdownBtn');
    const personaMenu = document.getElementById('personaMenu');
    const currentPersonaLabel = document.getElementById('currentPersonaLabel');
    const audioPlayer = document.getElementById('audioPlayer');
    const ambientGlow = document.getElementById('ambientGlow');

    // Init Web Speech Recognition
    function initSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'uz-UZ';
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onstart = () => {
          isRecording = true;
          speechBuffer = '';
          setVisualState('listening');
        };

        recognition.onresult = (event) => {
          let interimTranscript = '';
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              speechBuffer += event.results[i][0].transcript;
            } else {
              interimTranscript += event.results[i][0].transcript;
            }
          }
          const textToShow = speechBuffer || interimTranscript;
          if (textToShow && isSubtitlesOn) {
            speakerLabel.innerHTML = '<i class="fa-solid fa-microphone text-blue-400 mr-1"></i> Siz:';
            subtitlesText.innerText = `"${textToShow}"`;
          }
        };

        recognition.onerror = (e) => {
          console.warn('Speech recognition xatosi:', e.error);
          if (isRecording) {
            stopListening();
          }
        };

        recognition.onend = () => {
          isRecording = false;
          if (speechBuffer.trim()) {
            sendToGemini(speechBuffer.trim());
          } else {
            setVisualState('idle');
          }
        };
      } else {
        console.warn("Brauzeringiz SpeechRecognition'ni qo'llab-quvvatlamaydi. Klaviatura rejimi mavjud.");
      }
    }

    // Holatni vizual o'zgartirish
    function setVisualState(state) {
      if (state === 'listening') {
        statusDot.className = 'w-2 h-2 rounded-full bg-blue-500 animate-ping';
        statusText.innerText = 'Eshitilmoqda... Gapiring!';
        statusBadge.className = 'inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-blue-950/60 border border-blue-500 text-xs font-semibold text-blue-300 shadow-lg';
        radarRing.className = 'absolute w-56 h-56 rounded-full border-2 border-blue-500/50 -z-0 opacity-100 pulse-ring-active';
        ambientGlow.className = 'absolute w-72 h-72 rounded-full bg-blue-600/20 blur-[90px] -z-10 transition-all duration-500';
        flameContainer.classList.remove('flame-active');
        soundBars.classList.remove('opacity-0');
        mouth.classList.remove('talking-mouth');
        mouth.style.height = '4px';
      } else if (state === 'thinking') {
        isThinking = true;
        statusDot.className = 'w-2 h-2 rounded-full bg-amber-500 animate-spin';
        statusText.innerText = "Ustoz o'ylamoqda...";
        statusBadge.className = 'inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-amber-950/60 border border-amber-500 text-xs font-semibold text-amber-300 shadow-lg';
        radarRing.className = 'absolute w-56 h-56 rounded-full border-2 border-amber-500/50 -z-0 opacity-100';
        ambientGlow.className = 'absolute w-72 h-72 rounded-full bg-amber-600/20 blur-[90px] -z-10 transition-all duration-500';
        flameContainer.classList.remove('flame-active');
        soundBars.classList.add('opacity-0');
      } else if (state === 'speaking') {
        isSpeaking = true;
        isThinking = false;
        statusDot.className = 'w-2 h-2 rounded-full bg-red-500 animate-pulse';
        statusText.innerText = 'Ustoz gapirmoqda... 🔥';
        statusBadge.className = 'inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-red-950/80 border border-red-500 text-xs font-bold text-red-300 shadow-xl shadow-red-600/30';
        flameContainer.classList.add('flame-active');
        radarRing.className = 'absolute w-56 h-56 rounded-full border-2 border-red-500/60 -z-0 opacity-100 pulse-ring-active';
        ambientGlow.className = 'absolute w-72 h-72 rounded-full bg-red-600/35 blur-[90px] -z-10 transition-all duration-500';
        soundBars.classList.remove('opacity-0');
        mouth.classList.add('talking-mouth');
      } else { // idle
        isSpeaking = false;
        isThinking = false;
        statusDot.className = 'w-2 h-2 rounded-full bg-neutral-500';
        statusText.innerText = isHandsFree ? 'Hands-free rejim: Gapiring...' : 'Gapirish uchun tugmani bosing';
        statusBadge.className = 'inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-neutral-900 border border-neutral-800 text-xs font-semibold text-neutral-300 shadow-md';
        flameContainer.classList.remove('flame-active');
        radarRing.className = 'absolute w-56 h-56 rounded-full border-2 border-red-500/30 -z-0 opacity-0 transition-opacity duration-300';
        ambientGlow.className = 'absolute w-72 h-72 rounded-full bg-red-600/15 blur-[90px] -z-10 transition-all duration-500';
        soundBars.classList.add('opacity-0');
        mouth.classList.remove('talking-mouth');
        mouth.style.height = '6px';
      }
    }

    function primeAudio() {
      if (audioPlayer) {
        try {
          if (!audioPlayer.src || audioPlayer.src === "" || audioPlayer.src.endsWith(window.location.href)) {
            audioPlayer.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
          }
          const p = audioPlayer.play();
          if (p !== undefined) {
            p.then(() => {
              audioPlayer.pause();
              audioPlayer.currentTime = 0;
            }).catch(() => {});
          }
        } catch (e) {}
      }
    }

    let micPermissionGranted = false;
    let activeRecognition = null;
    let activeMediaRecorder = null;
    let recordedAudioChunks = [];
    let activeMediaStream = null;
    let handsFreeTimer = null;

    function cancelHandsFreeTimer() {
      if (handsFreeTimer) {
        clearTimeout(handsFreeTimer);
        handsFreeTimer = null;
      }
    }

    function scheduleHandsFreeNextTurn(delayMs = 600) {
      cancelHandsFreeTimer();
      if (!isHandsFree) return;
      handsFreeTimer = setTimeout(() => {
        handsFreeTimer = null;
        if (isHandsFree && !isSpeaking && !isThinking && !isRecording) {
          startListening();
        }
      }, delayMs);
    }

    async function requestMicPermissionOnce() {
      if (micPermissionGranted) return true;
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(t => t.stop());
          micPermissionGranted = true;
          return true;
        } catch (e) {
          console.warn("Mikrofon ruxsati berilmadi:", e);
          return false;
        }
      }
      return true;
    }

    async function startListening() {
      if (isSpeaking || isThinking) return;
      primeAudio();
      cancelHandsFreeTimer();

      await requestMicPermissionOnce();

      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (SpeechRec) {
        startSpeechRecognition(SpeechRec);
      } else if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        startMediaRecorder();
      } else {
        toggleTextInput(true);
      }
    }

    function startSpeechRecognition(SpeechRec) {
      if (activeRecognition) {
        try { activeRecognition.abort(); } catch (e) {}
        activeRecognition = null;
      }

      try {
        const rec = new SpeechRec();
        rec.lang = 'uz-UZ';
        rec.continuous = false;
        rec.interimResults = true;
        rec.maxAlternatives = 1;

        let buffer = '';
        let interim = '';

        rec.onstart = () => {
          isRecording = true;
          setVisualState('listening');
        };

        rec.onresult = (event) => {
          interim = '';
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              buffer += ' ' + event.results[i][0].transcript;
            } else {
              interim += ' ' + event.results[i][0].transcript;
            }
          }
          const textToShow = (buffer + ' ' + interim).trim();
          if (textToShow && isSubtitlesOn) {
            speakerLabel.innerHTML = '<i class="fa-solid fa-microphone text-blue-400 mr-1"></i> Siz:';
            subtitlesText.innerText = `"${textToShow}"`;
          }
        };

        rec.onerror = (e) => {
          console.warn('Speech recognition warning:', e.error);
          isRecording = false;
          activeRecognition = null;
          if (e.error === 'no-speech' && isHandsFree && !isSpeaking && !isThinking) {
            scheduleHandsFreeNextTurn(500);
          } else {
            setVisualState('idle');
          }
        };

        rec.onend = () => {
          isRecording = false;
          activeRecognition = null;
          const finalText = (buffer + ' ' + interim).trim();
          if (finalText) {
            sendToGemini(finalText);
          } else {
            setVisualState('idle');
            if (isHandsFree && !isSpeaking && !isThinking) {
              scheduleHandsFreeNextTurn(600);
            }
          }
        };

        activeRecognition = rec;
        rec.start();
      } catch (err) {
        console.warn("Recognition start xatosi:", err.message);
        isRecording = false;
        activeRecognition = null;
        setVisualState('idle');
        if (isHandsFree && !isSpeaking && !isThinking) {
          scheduleHandsFreeNextTurn(1000);
        }
      }
    }

    async function startMediaRecorder() {
      if (activeMediaRecorder && activeMediaRecorder.state === 'recording') return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        activeMediaStream = stream;
        recordedAudioChunks = [];

        const mimeType = (typeof MediaRecorder.isTypeSupported === 'function' && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) ? 'audio/webm;codecs=opus' :
                         (typeof MediaRecorder.isTypeSupported === 'function' && MediaRecorder.isTypeSupported('audio/mp4')) ? 'audio/mp4' : '';

        const options = mimeType ? { mimeType } : {};
        const mr = new MediaRecorder(stream, options);

        mr.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) recordedAudioChunks.push(e.data);
        };

        mr.onstart = () => {
          isRecording = true;
          setVisualState('listening');
        };

        mr.onstop = async () => {
          isRecording = false;
          if (activeMediaStream) {
            activeMediaStream.getTracks().forEach(t => t.stop());
            activeMediaStream = null;
          }
          if (recordedAudioChunks.length > 0) {
            const audioBlob = new Blob(recordedAudioChunks, { type: mimeType || 'audio/webm' });
            sendAudioBlobToGemini(audioBlob);
          } else {
            setVisualState('idle');
            if (isHandsFree && !isSpeaking && !isThinking) {
              scheduleHandsFreeNextTurn(600);
            }
          }
        };

        activeMediaRecorder = mr;
        mr.start();

        if (isHandsFree) {
          setTimeout(() => {
            if (activeMediaRecorder && activeMediaRecorder.state === 'recording') {
              stopListening();
            }
          }, 4000);
        }
      } catch (err) {
        console.warn("MediaRecorder start error:", err);
        isRecording = false;
        setVisualState('idle');
      }
    }

    function stopListening() {
      if (activeRecognition) {
        setTimeout(() => {
          try {
            if (activeRecognition) activeRecognition.stop();
          } catch (e) {}
        }, 350);
      }
      if (activeMediaRecorder && activeMediaRecorder.state === 'recording') {
        try {
          activeMediaRecorder.stop();
        } catch (e) {}
      }
    }

    async function sendAudioBlobToGemini(audioBlob) {
      setVisualState('thinking');
      const reader = new FileReader();
      reader.readAsDataURL(audioBlob);
      reader.onloadend = async () => {
        try {
          const base64Data = (reader.result || '').split(',')[1];
          if (!base64Data) {
            setVisualState('idle');
            if (isHandsFree) scheduleHandsFreeNextTurn(600);
            return;
          }
          const resp = await fetch('/api/voice-agent/talk', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              audioBase64Input: base64Data,
              audioMimeType: audioBlob.type || 'audio/webm',
              history: conversationHistory.slice(-8),
              persona: currentPersona,
              voice: currentVoice || 'uz-UZ-MadinaNeural'
            })
          });
          const data = await resp.json();
          if (data && data.replyText) {
            conversationHistory.push({ role: 'model', text: data.replyText });

            speakerLabel.innerHTML = `<i class="fa-solid fa-fire text-red-500 mr-1"></i> ${data.persona?.name || "Ustoz"}:`;
            subtitlesText.innerText = `"${data.replyText}"`;

            if (data.audioBase64) {
              playTtsAudio(data.audioBase64, data.replyText, data.audioFormat);
            } else {
              fallbackSpeak(data.replyText);
            }
          } else {
            fallbackSpeak("Sen ahmoq! Nega gapirmay vaqtimni o'g'irlayapsan?! Tezroq gapir, yaramas!");
          }
        } catch (e) {
          console.error("Audio yuborish xatosi:", e);
          fallbackSpeak("Menga qara! Bosh chayqab o'tirmasdan, og'zingni ochib aniq gapir! Dars o'tyaptimi bu yerda?!");
        }
      };
    }

    // Gemini Voice Agent Backendiga so'rov yuborish
    async function sendToGemini(text) {
      const cleanText = (text && text.trim()) ? text.trim() : "Ustoz, men jim turibman!";
      setVisualState('thinking');
      liveTimestamp.innerText = new Date().toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });

      conversationHistory.push({ role: 'user', text: cleanText });

      try {
        const resp = await fetch('/api/voice-agent/talk', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: cleanText,
            history: conversationHistory.slice(-8),
            persona: currentPersona,
            voice: currentVoice || 'uz-UZ-MadinaNeural'
          })
        });

        const data = await resp.json();

        if (data && data.replyText) {
          conversationHistory.push({ role: 'model', text: data.replyText });

          speakerLabel.innerHTML = `<i class="fa-solid fa-fire text-red-500 mr-1"></i> ${data.persona?.name || "Ustoz"}:`;
          subtitlesText.innerText = `"${data.replyText}"`;

          if (data.audioBase64) {
            playTtsAudio(data.audioBase64, data.replyText, data.audioFormat);
          } else {
            fallbackSpeak(data.replyText);
          }
        } else {
          fallbackSpeak("Sen ahmoq! Nega gapirmay vaqtimni o'g'irlayapsan?! Tezroq gapir, yaramas!");
        }
      } catch (err) {
        console.error("Agent error:", err);
        fallbackSpeak("Menga qara! Bosh chayqab o'tirmasdan, og'zingni ochib aniq gapir! Dars o'tyaptimi bu yerda?!");
      }
    }

    // Ovozli javobni (TTS) ijro etish
    function playTtsAudio(base64Audio, textFallback, audioFormat = 'audio/mp3') {
      setVisualState('speaking');
      if (!audioPlayer) {
        fallbackSpeak(textFallback);
        return;
      }

      const mime = audioFormat || (base64Audio.startsWith('//O') || base64Audio.startsWith('SUQz') ? 'audio/mp3' : 'audio/wav');
      audioPlayer.src = base64Audio.startsWith('data:') ? base64Audio : `data:${mime};base64,${base64Audio}`;
      audioPlayer.volume = 1.0;
      
      const p = audioPlayer.play();
      if (p !== undefined) {
        p.catch(e => {
          console.warn("Autoplay blocked, using fallback speech synthesis:", e.message);
          fallbackSpeak(textFallback);
        });
      }

      audioPlayer.onended = () => {
        setVisualState('idle');
        if (isHandsFree) scheduleHandsFreeNextTurn(600);
      };

      audioPlayer.onerror = () => {
        fallbackSpeak(textFallback);
      };
    }

    function fallbackSpeak(text) {
      setVisualState('speaking');
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          window.speechSynthesis.resume();
          const utter = new SpeechSynthesisUtterance(text);

          const voices = window.speechSynthesis.getVoices() || [];
          const bestVoice = voices.find(v => v.lang.startsWith('uz')) ||
                            voices.find(v => v.lang.startsWith('tr')) ||
                            voices.find(v => v.lang.startsWith('ru')) ||
                            voices[0];
          if (bestVoice) {
            utter.voice = bestVoice;
            utter.lang = bestVoice.lang;
          } else {
            utter.lang = 'uz-UZ';
          }

          utter.rate = 1.15;
          utter.pitch = 1.1;
          utter.onend = () => {
            setVisualState('idle');
            if (isHandsFree) scheduleHandsFreeNextTurn(600);
          };
          utter.onerror = () => {
            setVisualState('idle');
            if (isHandsFree) scheduleHandsFreeNextTurn(800);
          };
          window.speechSynthesis.speak(utter);
          return;
        } catch (e) {}
      }
      simulateSpeakingVisual(3500);
    }
      simulateSpeakingVisual(3500);
    }

    function simulateSpeakingVisual(durationMs) {
      setVisualState('speaking');
      setTimeout(() => {
        setVisualState('idle');
      }, durationMs);
    }

    // Tezkor provokatsion savol yuborish
    function sendQuickPrompt(promptText) {
      speakerLabel.innerHTML = '<i class="fa-solid fa-microphone text-blue-400 mr-1"></i> Siz:';
      subtitlesText.innerText = `"${promptText}"`;
      sendToGemini(promptText);
    }

    // Qo'lda yozish
    function toggleTextInput(forceShow = false) {
      const box = document.getElementById('manualInputContainer');
      if (forceShow) {
        box.classList.remove('hidden');
        document.getElementById('manualInputText').focus();
      } else {
        box.classList.toggle('hidden');
        if (!box.classList.contains('hidden')) {
          document.getElementById('manualInputText').focus();
        }
      }
    }

    function submitManualText() {
      const input = document.getElementById('manualInputText');
      const val = input.value.trim();
      if (val) {
        speakerLabel.innerHTML = '<i class="fa-solid fa-keyboard text-blue-400 mr-1"></i> Siz:';
        subtitlesText.innerText = `"${val}"`;
        sendToGemini(val);
        input.value = '';
      }
    }

    document.getElementById('manualInputText').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitManualText();
    });

    // Persona almashtirish
    function selectPersona(p) {
      currentPersona = p;
      document.getElementById('check-angry').classList.toggle('hidden', p !== 'angry');
      document.getElementById('check-judge').classList.toggle('hidden', p !== 'judge');
      document.getElementById('check-coach').classList.toggle('hidden', p !== 'coach');

      if (p === 'angry') {
        currentPersonaLabel.innerText = "Ustoz AI: Angry 🔥";
      } else if (p === 'judge') {
        currentPersonaLabel.innerText = "Ustoz AI: Sudya ⚖️";
      } else {
        currentPersonaLabel.innerText = "Ustoz AI: Coach ⚡";
      }
      personaMenu.classList.add('hidden');
    }

    personaDropdownBtn.addEventListener('click', () => {
      personaMenu.classList.toggle('hidden');
    });

    // Hands-Free rejimini yoqish/o'chirish
    handsFreeBtn.addEventListener('click', () => {
      isHandsFree = !isHandsFree;
      handsFreeStatus.innerText = isHandsFree ? 'Yoqiq' : "O'chiq";
      handsFreeStatus.className = isHandsFree ? 'text-[9px] text-green-400 font-bold' : 'text-[9px] text-neutral-500';
      handsFreeBtn.className = isHandsFree 
        ? 'flex-1 flex flex-col items-center justify-center py-2.5 px-2 rounded-2xl border border-green-500/50 bg-green-950/40 text-green-300 transition'
        : 'flex-1 flex flex-col items-center justify-center py-2.5 px-2 rounded-2xl border border-neutral-800 bg-neutral-950/60 text-neutral-400 hover:text-neutral-200 hover:border-neutral-700 transition';

      if (isHandsFree) {
        startListening();
      } else {
        cancelHandsFreeTimer();
        stopListening();
        setVisualState('idle');
      }
    });

    // Subtitr tugmasi
    subtitlesToggleBtn.addEventListener('click', () => {
      isSubtitlesOn = !isSubtitlesOn;
      subtitlesBox.style.display = isSubtitlesOn ? 'flex' : 'none';
      subtitlesStatus.innerText = isSubtitlesOn ? 'Yoqiq' : "O'chiq";
      subtitlesStatus.className = isSubtitlesOn ? 'text-[9px] text-red-400' : 'text-[9px] text-neutral-500';
    });

    // Hold to talk tugmasi hodisalari (Desktop va Mobile Touch)
    function onTalkStart(e) {
      e.preventDefault();
      talkBtn.classList.add('scale-95', 'brightness-125');
      talkBtnLabel.innerText = "Eshitilmoqda...";
      startListening();
    }

    function onTalkEnd(e) {
      e.preventDefault();
      talkBtn.classList.remove('scale-95', 'brightness-125');
      talkBtnLabel.innerText = "Hold to talk";
      stopListening();
    }

    talkBtn.addEventListener('mousedown', onTalkStart);
    talkBtn.addEventListener('mouseup', onTalkEnd);
    talkBtn.addEventListener('touchstart', onTalkStart, { passive: false });
    talkBtn.addEventListener('touchend', onTalkEnd, { passive: false });

    // Telegram Web App Initsializatsiyasi
    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      try {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#000000');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
        if (tg.BackButton) {
          tg.BackButton.show();
          tg.BackButton.onClick(() => tg.close());
        }
      } catch (e) {
        console.warn('Telegram WebApp init error:', e);
      }
    }

    // Qayta boshlash yoki Botga qaytish
    document.getElementById('resetSessionBtn').addEventListener('click', () => {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.close();
      } else {
        conversationHistory = [];
        audioPlayer.pause();
        setVisualState('idle');
        subtitlesText.innerText = '"Sessiya yakunlandi. Yangi savol bilan darsni boshlang!"';
        speakerLabel.innerHTML = '<i class="fa-solid fa-volume-high mr-1 text-red-500"></i> Ustoz:';
      }
    });

    // Sahifa yuklanganda ishga tushirish
    window.addEventListener('DOMContentLoaded', () => {
      initSpeech();
      setVisualState('idle');
    });
  </script>
</body>
